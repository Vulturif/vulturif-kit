name: Build & release

# Push a tag like v1.0.4 and this builds, signs and publishes the release on
# the public repo named in vulturif.toml — the same steps `vkit release` runs
# locally, minus the ssh sync (vulturif.com's cron picks it up within 30
# minutes). Release locally OR push the tag, not both: a local
# `vkit release --push-tag` would publish twice.
#
# An annotated tag's message becomes the release notes:
#   git tag -a v1.0.4 -m "- Fixed the thing"  &&  git push origin v1.0.4
#
# Secrets of THIS repo:
#   RELEASE_TOKEN       fine-grained PAT, Contents: Read and write on the
#                       public repo (GITHUB_TOKEN cannot write to another one)
#   UPDATE_SIGNING_KEY  the Ed25519 key; `vkit sign` refuses any other

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read   # only for checking out this repo; the release uses RELEASE_TOKEN

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        # PyInstaller from source, with a bootloader compiled here (MSVC is on
        # the runner). The stock bootloader sits in countless other exes,
        # malware included, and generic scanner detections key on it; our own
        # build does not match them. Fails the job if it cannot compile.
        env:
          PIP_NO_BINARY: pyinstaller
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller "vulturif-kit[release] @ git+https://github.com/Vulturif/vulturif-kit@v0.1.0"

      - name: Tag message for the release notes
        # checkout fetches the tag as a ref only; fetch the tag object too.
        run: git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"

      - run: gh auth setup-git
      - run: vkit release --ci --skip sync
