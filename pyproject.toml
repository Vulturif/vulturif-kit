[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulturif-kit"
version = "0.8.0"
description = "What every Vulturif app shares: updater, signed releases, pinned add-on downloads, opt-in stats, error reports, encrypted credentials, shared themes — and the release CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# Only the machine that releases needs these, never the exe.
release = ["cryptography>=42"]
# The local media tagger. ONNX only — never torch — so the add-on stays small
# and CPU-friendly. An app that wants it pins vulturif-kit[tagging]@vX.Y.Z.
tagging = ["onnxruntime>=1.17", "numpy>=1.24", "Pillow>=10"]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
vkit = "vulturif_kit.release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulturif_kit.release" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
