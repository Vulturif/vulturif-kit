[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulturif-kit"
version = "0.2.0"
description = "What every Vulturif app shares: updater, signed releases, opt-in stats, error reports, encrypted credentials — and the release CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# Only the machine that releases needs these, never the exe.
release = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
vkit = "vulturif_kit.release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulturif_kit.release" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
